name: FHQCM PDF Proof

on:
  push:
    paths:
      - 'books/fhqcm/**'
      - 'scripts/fhqcm-polish-and-validate.mjs'
      - 'scripts/generate-fhqcm-images.mjs'
      - 'package.json'
      - '.github/workflows/fhqcm-pdf-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fhqcm-pdf-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fhqcm-pdf:
    name: Build FHQCM PDF Proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run FHQCM polish validator
        run: npm run fhqcm:polish

      - name: Build PDF with XeLaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          working_directory: books/fhqcm/manuscript
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -pdf -xelatex -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Collect PDF proof
        run: |
          mkdir -p dist/fhqcm
          cp books/fhqcm/manuscript/main.pdf dist/fhqcm/fhqcm-first-proof.pdf
          cp books/fhqcm/reports/polish-validation-report.md dist/fhqcm/polish-validation-report.md

      - name: Upload PDF proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fhqcm-first-proof
          path: dist/fhqcm
