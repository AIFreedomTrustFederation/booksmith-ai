name: FHQCM PDF Proof

on:
  push:
    paths:
      - 'books/fhqcm/**'
      - 'scripts/fhqcm-polish-and-validate.mjs'
      - 'scripts/generate-fhqcm-images.mjs'
      - 'package.json'
      - '.github/workflows/fhqcm-pdf-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fhqcm-pdf-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fhqcm-pdf:
    name: Build FHQCM PDF Proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Only this job can publish proof releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run FHQCM polish validator
        run: npm run fhqcm:polish

      - name: Build PDF with XeLaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          working_directory: books/fhqcm/manuscript
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -pdf -xelatex -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Collect PDF proof
        run: |
          mkdir -p dist/fhqcm
          cp books/fhqcm/manuscript/main.pdf dist/fhqcm/fhqcm-first-proof.pdf
          cp books/fhqcm/reports/polish-validation-report.md dist/fhqcm/polish-validation-report.md

      - name: Verify compiled PDF
        run: |
          test -s dist/fhqcm/fhqcm-first-proof.pdf
          python3 - <<'PY'
          from pathlib import Path
          pdf = Path('dist/fhqcm/fhqcm-first-proof.pdf').read_bytes()
          assert pdf.startswith(b'%PDF-'), 'Missing PDF header'
          assert b'%%EOF' in pdf[-2048:], 'Missing PDF EOF marker'
          print(f'PDF proof verified: {len(pdf)} bytes')
          PY

      - name: Upload PDF proof artifact
        id: pdf_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fhqcm-first-proof
          path: dist/fhqcm
          if-no-files-found: error
          retention-days: 90

      - name: Publish download link in run summary
        env:
          ARTIFACT_URL: ${{ steps.pdf_artifact.outputs.artifact-url }}
        run: |
          echo '## FHQCM PDF proof ready' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the compiled PDF proof and validation report]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub downloads the artifact as a ZIP. Extract `fhqcm-first-proof.pdf`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish permanent versioned PDF proof release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="fhqcm-proof-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cd dist/fhqcm
          sha256sum fhqcm-first-proof.pdf polish-validation-report.md > SHA256SUMS.txt
          gh release create "$tag" \
            fhqcm-first-proof.pdf polish-validation-report.md SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "FHQCM PDF proof ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automated draft proof from commit $GITHUB_SHA. Not a final publication; inspect content and layout before distribution." \
            --prerelease --latest=false
          echo "[Permanent versioned PDF release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})" >> "$GITHUB_STEP_SUMMARY"
          echo '[Browse all versioned FHQCM proof releases](https://github.com/AIFreedomTrustFederation/booksmith-ai/releases?q=fhqcm-proof)' >> "$GITHUB_STEP_SUMMARY"
