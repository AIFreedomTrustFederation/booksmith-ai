name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: booksmith-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate library, Runtime, and app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: npm

      - name: Verify inert dependency policy
        run: test "$(npm config get ignore-scripts)" = true

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Validate federated library
        run: npm run validate:library

      - name: Lint
        run: npm run lint

      - name: Build local/private Booksmith App
        run: npm run build

      - name: Smoke test Booksmith Runtime
        run: node scripts/runtime/smoke-test.mjs

      - name: Build static GitHub Pages mode
        run: |
          rm -rf .next out
          GITHUB_PAGES=true npm run build
