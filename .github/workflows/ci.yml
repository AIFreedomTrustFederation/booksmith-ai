name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate library, Runtime, and app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate federated library
        run: npm run validate:library

      - name: Lint
        run: npm run lint

      - name: Build local/private Booksmith App
        run: npm run build

      - name: Smoke test Booksmith Runtime
        run: node scripts/runtime/smoke-test.mjs

      - name: Build static GitHub Pages mode
        run: |
          rm -rf .next out
          GITHUB_PAGES=true npm run build
