name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: booksmith-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate library, Runtime, and app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate federated library
        run: npm run validate:library

      - name: Lint
        run: npm run lint

      - name: Build local/private Booksmith App
        run: npm run build

      - name: Smoke test Booksmith Runtime
        run: node scripts/runtime/smoke-test.mjs

      - name: Build static GitHub Pages mode
        run: |
          rm -rf .next out
          GITHUB_PAGES=true npm run build
